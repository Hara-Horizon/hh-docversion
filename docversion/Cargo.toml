[workspace]
members = [
    "crates/docversion-core",
    "crates/docversion-git",
    "crates/docversion-manifest",
    "crates/cargo-docversion",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["Hara Horizon Software Systems Inc. <dev@harahorizon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hara-horizon/docversion"
homepage = "https://harahorizon.com"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
thiserror = "1.0"
anyhow = "1.0"
cargo_metadata = "0.18"
clap = { version = "4.5", features = ["derive", "env"] }
