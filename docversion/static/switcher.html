<!-- Drop-in header switcher for multi-version rustdoc -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const res = await fetch("/versions.json");
        if (!res.ok) return;
        const versions = await res.json();
        
        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const currentVer = pathParts[0] || "latest";

        const container = document.createElement("div");
        container.style = "position: fixed; top: 12px; right: 24px; z-index: 10000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; display: flex; align-items: center; gap: 8px;";

        const label = document.createElement("span");
        label.textContent = "Version:";
        label.style = "color: #888; font-weight: 500;";

        const select = document.createElement("select");
        select.style = "padding: 4px 8px; border-radius: 4px; background: #222; color: #eee; border: 1px solid #444; cursor: pointer; outline: none;";

        versions.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.path;
            opt.textContent = v.name;
            if (v.path === currentVer || v.name === currentVer) opt.selected = true;
            select.appendChild(opt);
        });

        select.addEventListener("change", (e) => {
            const targetVersion = e.target.value;
            const remaining = pathParts.slice(1).join("/");
            window.location.href = `/${targetVersion}/${remaining}`;
        });

        container.appendChild(label);
        container.appendChild(select);
        document.body.appendChild(container);
    } catch (err) {
        console.warn("docversion: unable to initialize version switcher dropdown", err);
    }
});
</script>
